# Site settings
title: Personal Paper Notes
description: "Personal notes on recent papers - short and for my own reference"
url: "https://iishaan-i.github.io"
baseurl: ""
lang: en

# Build settings
markdown: kramdown
permalink: /notes/papers/:title/

# Use GitHub-Flavored Markdown so a single newline in the Obsidian source
# becomes a visual line break (Obsidian's preview behavior), instead of
# being collapsed to a space by default kramdown.
kramdown:
  input: GFM
  hard_wrap: true

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag

# Pagination
paginate: 20
paginate_path: "/notes/page/:num/"

# Collections
collections:
  posts:
    output: true

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md

# Theme
theme: null

