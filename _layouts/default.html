<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% if page.layout == "post" %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"
    onload="document.querySelectorAll('.math-render').forEach(function(el){
      try {
        katex.render(el.getAttribute('data-math'), el, {
          displayMode: el.getAttribute('data-display') === 'block',
          throwOnError: false
        });
      } catch (e) {
        el.textContent = el.getAttribute('data-math');
      }
    });"></script>
  {% endif %}
</head>
<body>
  <div class="container">
    <nav class="site-nav">
      <a href="/" class="nav-link">Home</a>
      <span class="nav-separator">·</span>
      <a href="/notes/" class="nav-link current">Notes</a>
    </nav>
    
    <header class="site-header">
      <h1 class="site-title">{{ site.title }}</h1>
      <p class="site-description">{{ site.description }}</p>
    </header>

    <main class="content">
      {{ content }}
    </main>
  </div>
</body>
</html>
